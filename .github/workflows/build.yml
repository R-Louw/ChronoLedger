name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc \
            meson \
            ninja-build \
            pkg-config \
            libgtk-4-dev \
            libepoxy-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libglib2.0-dev \
            libjson-glib-dev

      - name: Configure
        run: meson setup build --buildtype=release

      - name: Compile
        run: meson compile -C build
